name: backtest
# Nightly backtest of both paper traders (PMR + SMC) on the top 10 stock perps over 180 days. REPORT ONLY: it never touches the
# live accounts. The report goes to branch `backtest-report` of this public repo (no secrets needed); the desk's 7 Backtest
# panel reads it from raw.githubusercontent.com. GitHub's cron can be late or skipped; run it by hand from the Actions tab too.
on:
  workflow_dispatch:
    inputs:
      days: { description: "Days, or 'max' = from each symbol's listing", default: '180' }
      top: { description: 'Top N stock perps by 24h volume', default: '10' }
      symbols: { description: 'Comma list instead of top N (e.g. NVDAUSDT,TSLAUSDT)', default: '' }
      source: { description: "'trade' = traded 1m klines, 'mark' = mark-price 1m klines (full history)", default: 'trade' }
      variants: { description: "PMR variants table ('0' = skip, faster)", default: '1' }
  schedule:
    - cron: '17 9 * * *'
concurrency:
  group: backtest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      # Fetched 1m bars are cached between runs, so a rerun only downloads what is new.
      - uses: actions/cache@v4
        with:
          path: .bt-cache
          key: bt-bars-${{ github.run_id }}
          restore-keys: bt-bars-
      - run: node --max-old-space-size=6000 bot/backtest.mjs
        env:
          BT_DAYS: ${{ inputs.days || '180' }}
          BT_TOP: ${{ inputs.top || '10' }}
          BT_SYMBOLS: ${{ inputs.symbols || '' }}
          BT_SOURCE: ${{ inputs.source || 'trade' }}
          BT_VARIANTS: ${{ inputs.variants || '1' }}
          BT_CACHE: .bt-cache
          BT_OUT: out/stock-backtest.json
      - name: Publish to branch backtest-report
        run: |
          cd out
          git init -q -b backtest-report
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-backtest.json
          git commit -q -m "stock backtest $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backtest-report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
