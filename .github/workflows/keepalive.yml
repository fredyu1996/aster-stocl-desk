name: keepalive
# GitHub pauses scheduled workflows after 60 days without a commit. A monthly empty-diff touch keeps them running.
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .keepalive && git commit -m "keepalive" && git push
